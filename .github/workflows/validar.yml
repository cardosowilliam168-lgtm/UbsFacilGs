name: Validar entrega

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modelos BPMN são XML válido
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout bizagi/*.bpmn
      - name: Arquivos obrigatórios existem
        run: |
          for f in entrega/UBS-Facil_GS2026-2_BSPAD.pdf diagramas/as-is.png diagramas/to-be.png storyboard/storyboard-jornada-do-cidadao.png README.md; do
            test -s "$f" || { echo "Faltando: $f"; exit 1; }
          done
          test "$(ls pencil/*.png | wc -l)" -ge 4 || { echo "Protótipo precisa de 4 a 6 telas"; exit 1; }

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r app/requirements.txt
      - name: Rodar testes do MVP
        run: python -m pytest -q app/tests
